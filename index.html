:root{--bg:#04060b;--bg2:#0a1020;--ink:#eaf1ff;--mute:#8a97b4;--blue:#1e7bff;--green:#2fd45a;--line:rgba(120,160,255,.16);

:root[data-theme="light"]{--bg:#f4f7fc;--bg2:#e6edf8;--ink:#0a1226;--mute:#55627f;--line:rgba(10,30,80,.14)}

.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;letter-spacing:.02em}
.brand img{width:34px;height:34px;border-radius:9px}
nav div a{margin-left:22px;text-decoration:none;color:var(--mute);font-size:15px}
nav div a:hover{color:var(--ink)}
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:110px 6vw 60px;position:relative;
background:radial-gradient(60% 45% at 50% 38%,rgba(30,123,255,.22),transparent 70%),radial-gradient(40% 30% at 62% 52%,rgba(47,212,90,.14),transparent 70%)}
.logo{position:relative;width:min(300px,62vw);margin:auto;border-radius:28px;perspective:800px;transition:transform .15s ease-out}
.fl{position:relative;border-radius:28px;animation:float 6s ease-in-out 1.4s infinite}
.logo img{width:100%;display:block;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both,glow 4s ease-in-out 1.4s infinite!important}
.logo i{position:absolute;inset:0;border-radius:28px;overflow:hidden;pointer-events:none}
.logo i::after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:sweep 4.5s ease-in-out 2s infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{box-shadow:0 0 70px rgba(30,123,255,.3),0 0 110px rgba(47,212,90,.08)}50%{box-shadow:0 0 120px rgba(30,123,255,.55),0 0 160px rgba(47,212,90,.28)}}
@keyframes sweep{0%{left:-60%}55%,100%{left:140%}}
.hero img{width:min(300px,62vw);border-radius:28px;box-shadow:0 0 90px rgba(30,123,255,.35),0 0 140px rgba(47,212,90,.12);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.94)}}
h1{font-size:clamp(34px,7vw,72px);line-height:1.08;font-weight:700;margin:38px auto 0;max-width:15em;letter-spacing:-.02em}
.by{margin-top:18px;font:700 clamp(18px,3vw,26px) Sora,sans-serif;letter-spacing:.3em;color:var(--green)}
.sub{margin:18px auto 0;max-width:32em;color:var(--mute)}
section{padding:96px 6vw;max-width:1080px;margin:auto}
h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.01em;margin-bottom:22px}
.w{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(6px);transition:opacity .55s,transform .55s,filter .55s}
.w.on{opacity:1;transform:none;filter:none}
.about{display:grid;gap:56px;grid-template-columns:1fr 1fr}
.me{display:flex;align-items:center;flex-wrap:wrap;gap:26px;margin:0 0 24px}
.ph{position:relative;flex:none;width:150px;height:150px;border-radius:50%;filter:drop-shadow(0 0 26px rgba(30,123,255,.45))}
.ph::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--blue),var(--green),var(--blue));animation:spin 6s linear infinite}
.ph img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--bg);display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.iam{font:700 15px Sora,sans-serif;letter-spacing:.5em;color:var(--green);margin-bottom:8px}
.name{font:700 clamp(34px,8vw,64px)/1 Sora,sans-serif;letter-spacing:.04em;margin:0;background:linear-gradient(100deg,var(--blue) 0%,#6fe3ff 35%,var(--green) 70%,var(--blue) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(47,212,90,.35));animation:sheen 5s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
.about p{color:var(--mute);max-width:34em}
.about h2{background:linear-gradient(90deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.apps{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.app{display:block;text-decoration:none;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:26px;padding:22px;background:linear-gradient(160deg,var(--bg2),var(--bg));color:inherit;font:inherit;transition:transform .35s,border-color .35s,box-shadow .35s}
.app:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 20px 60px -20px rgba(30,123,255,.55)}
.app img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block}
.app h3{font-size:22px;margin:18px 0 4px}
.app p{color:var(--mute);font-size:15px}
.app b{display:inline-block;margin-top:14px;font:500 15px Sora,sans-serif;color:var(--green)}
.cs{color:var(--mute);max-width:34em;margin-bottom:34px}
.soc{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.soc a{--c:var(--blue);display:flex;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--line);border-radius:22px;text-decoration:none;background:linear-gradient(160deg,var(--bg2),var(--bg));transition:transform .35s,border-color .35s,box-shadow .35s}
.soc a:hover,.soc a:focus-visible{transform:translateY(-5px);border-color:var(--c);box-shadow:0 18px 50px -18px var(--c)}
.soc svg{width:44px;height:44px;flex:none;padding:10px;border-radius:14px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);transition:transform .35s}
.soc a:hover svg{transform:rotate(-8deg) scale(1.08)}
.soc strong{display:block;font:700 18px Sora,sans-serif}
.soc em{font-style:normal;color:var(--mute);font-size:14px}
footer{padding:40px 6vw calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:760px){.about{grid-template-columns:1fr;gap:40px}section{padding:70px 6vw}nav div a:first-child{display:none}.soc a{padding:16px 18px}}
@media(prefers-reduced-motion:reduce){.ph::before{animation:none}.fl,.logo img,.logo i::after{animation:none!important}.name{animation:none}.w{transition:none;opacity:1;transform:none;filter:none}.hero img{animation:none}html{scroll-behavior:auto}}
</style>
</head>

function render(list,id,label){const grid=document.getElementById(id);
list.forEach(a=>{
 const el=document.createElement('a');el.className='app';el.href=a.url;el.target='_blank';el.rel='noopener noreferrer';
 el.setAttribute('aria-label','Open '+a.name);
 const i=document.createElement('img');i.src=a.img;i.alt=a.name+' logo';
 const h=document.createElement('h3');h.textContent=a.name;
 const p=document.createElement('p');p.textContent=a.desc;
 const b=document.createElement('b');b.textContent=label;
 el.append(i,h,p,b);
 grid.appendChild(el);
});}
render(APPS,'grid','Open app');render(GAMES,'ggrid','Play game');
document.getElementById('y').textContent=new Date().getFullYear();

// Word-by-word reveal
function split(el){
 const words=el.dataset.words.split(' ');
 el.setAttribute('aria-label',el.dataset.words);
 words.forEach((t,i)=>{const s=document.createElement('span');s.className='w';s.setAttribute('aria-hidden','true');s.textContent=t;el.appendChild(s);if(i<words.length-1)el.appendChild(document.createTextNode(' '))});
}
function play(el,delay){
 el.querySelectorAll('.w').forEach((w,i)=>setTimeout(()=>w.classList.add('on'),delay+i*110));
}
const els=[...document.querySelectorAll('[data-words]')];
els.forEach(split);
const io=new IntersectionObserver(es=>es.forEach(e=>{
 if(e.isIntersecting){play(e.target,+(e.target.dataset.delay||0));io.unobserve(e.target)}
}),{threshold:.35});
els.forEach(e=>e.closest('.hero')?play(e,+(e.dataset.delay||500)):io.observe(e));
const lg=document.getElementById('logo');
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
 addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;lg.style.transform='rotateY('+x*14+'deg) rotateX('+(-y*14)+'deg)'});
 addEventListener('pointerleave',()=>{lg.style.transform=''});
}
</script>
